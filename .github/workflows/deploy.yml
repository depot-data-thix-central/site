name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Web
        run: |
          flutter build web --release --wasm \
            --dart-define=SUPABASE_URL=https://vmqedusamwdgfatgtgck.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtcWVkdXNhbXdkZ2ZhdGd0Z2NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTIzNTYsImV4cCI6MjEwNDk4ODM1Nn0.-olHKoENMJXjjVTSFP0mMJRpjQs6Mt0jZUxqSux_sJI

      - name: Verify build files
        run: |
          echo "=== Files in build/web ==="
          ls -la build/web/
          echo "=== Checking critical files ==="
          test -f build/web/flutter_bootstrap.js && echo "✅ flutter_bootstrap.js OK" || echo "❌ flutter_bootstrap.js MISSING"
          test -f build/web/main.dart.js && echo "✅ main.dart.js OK" || echo "❌ main.dart.js MISSING"
          test -f build/web/index.html && echo "✅ index.html OK" || echo "❌ index.html MISSING"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

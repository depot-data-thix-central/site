  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0A1628;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      color: #C9A227;
      letter-spacing: 0.25em;
      font-size: 11px;
      font-weight: 700;
      background: #0A1628;
      z-index: 9999;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 14px;
      border: 3px solid rgba(201, 162, 39, 0.25);
      border-top-color: #C9A227;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">

<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob: https://vmqedusamwdgfatgtgck.supabase.co;
                 font-src 'self' data:;
                 connect-src 'self' https://vmqedusamwdgfatgtgck.supabase.co wss://vmqedusamwdgfatgtgck.supabase.co;
                 base-uri 'self';
                 form-action 'self';
                 object-src 'none';
                 manifest-src 'self';
                 worker-src 'self' blob:;
                 child-src 'self' blob:;">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="SONATHIX GROUP développe des solutions technologiques souveraines et sécurisées pour une Afrique plus connectée, sécurisée et innovante.">
  <meta name="theme-color" content="#0A1628">

  <meta property="og:type" content="website">
  <meta property="og:title" content="SONATHIX GROUP — Construire la confiance numérique de demain">
  <meta property="og:locale" content="fr_FR">

  <title>SONATHIX GROUP — Construire la confiance numérique de demain</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0A1628;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      color: #C9A227;
      letter-spacing: 0.25em;
      font-size: 11px;
      font-weight: 700;
      background: #0A1628;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 14px;
      border: 3px solid rgba(201, 162, 39, 0.25);
      border-top-color: #C9A227;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* ✅ Styles pour le message d'erreur de timeout */
    .error-msg {
      max-width: 420px;
      padding: 24px;
      text-align: center;
      color: #E5E7EB;
      letter-spacing: normal;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
    }
    .error-msg h2 {
      color: #C9A227;
      font-size: 18px;
      margin: 0 0 12px;
      letter-spacing: 0.05em;
    }
    .error-msg p {
      margin: 8px 0;
      opacity: 0.85;
    }
    .error-msg code {
      display: inline-block;
      background: rgba(201, 162, 39, 0.15);
      color: #C9A227;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    .error-msg button {
      margin-top: 20px;
      padding: 10px 24px;
      background: #C9A227;
      color: #0A1628;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    .error-msg button:hover { background: #E3C04B; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>SONATHIX GROUP</div>
  </div>

  <noscript>
    SONATHIX GROUP nécessite JavaScript. Merci de l'activer pour continuer.
  </noscript>

  <script src="flutter_bootstrap.js" async></script>

  <!-- ✅ GARDE-FOU : si le splash est encore là après 15s, afficher un message -->
  <script>
    (function () {
      var TIMEOUT_MS = 15000;
      var t = setTimeout(function () {
        var el = document.getElementById('loading');
        if (!el) return;
        el.innerHTML =
          '<div class="error-msg">' +
          '<h2>Le site ne répond pas</h2>' +
          '<p>Le chargement a pris plus de ' + (TIMEOUT_MS / 1000) + ' secondes.</p>' +
          '<p>Causes possibles :</p>' +
          '<p>• Cache navigateur corrompu</p>' +
          '<p>• Ancien service worker actif</p>' +
          '<p>• Connexion réseau bloquée</p>' +
          '<p><strong>Solutions :</strong></p>' +
          '<p>1. <code>Ctrl + Maj + R</code> (refresh forcé)</p>' +
          '<p>2. Vider le cache du navigateur</p>' +
          '<p>3. Essayer en navigation privée</p>' +
          '<button onclick="location.reload(true)">Recharger la page</button>' +
          '</div>';
      }, TIMEOUT_MS);

      // ✅ Annule le timeout si Flutter démarre correctement
      window.__clearSplashTimeout = function () {
        clearTimeout(t);
      };
    })();
  </script>
</body>
</html>
